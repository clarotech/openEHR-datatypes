name: CI & Publish

on:
  push:
    branches: [ master ]
    tags:    [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build & test on every push / PR
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (net8.0)
        run: dotnet test -c Release --no-build --framework net8.0 --logger "console;verbosity=normal"

      - name: Test (net10.0)
        run: dotnet test -c Release --no-build --framework net10.0 --logger "console;verbosity=normal"

  # ─────────────────────────────────────────────────────────────────────────
  # Pack & publish — only on a version tag (v*.*.*)
  # ─────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to NuGet.org
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Extract version from tag
        id: version
        # strips the leading 'v' so v1.2.3 → 1.2.3
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: >
          dotnet pack openEHR-datatypes/openEHR-datatypes.csproj
          -c Release
          --no-restore
          -p:Version=${{ steps.version.outputs.VERSION }}
          -o ./artifacts

      - name: Push to NuGet.org
        run: >
          dotnet nuget push ./artifacts/*.nupkg
          --api-key ${{ secrets.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
